apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: deboeck
  labels:
    app: nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - name: nginx
        image: nginx
        ports:
        - containerPort: 80
        env:
          - name: DEMO_NAME
            valueFrom:
              configMapKeyRef:
                name: configmap-demo
                key: demo_name
