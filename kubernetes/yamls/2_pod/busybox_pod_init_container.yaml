apiVersion: v1
kind: Pod
metadata:
  name: naked-pod-demo
  namespace: default
spec:
  containers:
  - name: naked-hello-world
    image: busybox
    command: ['sh', '-c', 'echo "Hello World!" && tail -f /dev/null']
  initContainers:
  - name: init-busybox-container
    image: busybox
    command: ['sh', '-c', 'echo "Init Container" && sleep 5']
  restartPolicy: OnFailure  
