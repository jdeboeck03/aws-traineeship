apiVersion: v1
kind: Pod
metadata:
  name: naked-pod-demo
  namespace: default
spec:
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: nodenumber
            operator: In
            values:
            - "2"
  containers:
  - name: naked-hello-world
    image: busybox
    command: ['sh', '-c', 'echo "Hello World!" && tail -f /dev/null']
  restartPolicy: OnFailure  
